name: AI PR Review with Codex

on:
  pull_request:
    branches: [dev]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # REQUIRED for diff

      # 2. Setup GitHub CLI (for merge)
      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      # 3. Get PR diff
      - name: Get PR changes
        run: |
          git fetch origin dev
          git diff origin/dev...HEAD > pr.diff

      # 4. Call Codex (OpenAI API)
      - name: AI Review (Codex Fixed Properly)
        id: ai_review
        run: |
          # Escape diff safely into JSON string
          DIFF=$(jq -Rs . < pr.diff)
      
          # Create JSON payload safely
          JSON_PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            '{
              model: "gpt-4.1",
              input: ("You are a senior .NET reviewer. Analyze this PR diff and respond in JSON format:\n{\n  \"decision\": \"APPROVED or REJECT\",\n  \"reason\": \"short explanation\"\n}\n\nPR DIFF:\n" + $diff)
            }')
      
          # Call API
          RESPONSE=$(curl -s https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
      
          echo "$RESPONSE" > result.json
      
          echo "=== FULL AI RESPONSE ==="
          cat result.json
      
          # Extract decision
          DECISION=$(echo "$RESPONSE" | grep -o '"decision":"[^"]*"' | cut -d':' -f2 | tr -d '"')
      
          # Extract reason
          REASON=$(echo "$RESPONSE" | grep -o '"reason":"[^"]*"' | cut -d':' -f2- | tr -d '"')
      
          echo "Decision: $DECISION"
          echo "Reason: $REASON"
      
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
      
          if [ "$DECISION" = "APPROVED" ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # 5. Fail if rejected
      - name: Fail if AI rejects
        if: steps.ai_review.outputs.approved == 'false'
        run: |
          echo "❌ AI rejected PR"
          exit 1

      # 6. Auto merge if approved
      - name: Auto merge PR
        if: steps.ai_review.outputs.approved == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
